services:
  redis:
    image: redis:7-alpine
    container_name: minipay-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-yi111111lin} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: minipay-rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    restart: unless-stopped

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: minipay-rocketmq-broker
    command: sh mqbroker -n rocketmq-namesrv:9876 --enable-proxy
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    ports:
      - "10909:10909"
      - "10911:10911"
      - "8088:8081"
    depends_on:
      - rocketmq-namesrv
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: gateway
        SERVICE_PORT: 8080
    image: minipay/gateway:latest
    container_name: minipay-gateway
    env_file: .env.deploy
    environment:
      SERVER_PORT: 8080
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-minipay}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
    ports:
      - "8080:8080"
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: user-service
        SERVICE_PORT: 8083
    image: minipay/user-service:latest
    container_name: minipay-user-service
    env_file: .env.deploy
    environment:
      SERVER_PORT: 8083
    depends_on:
      - gateway
      - redis
    restart: unless-stopped

  product-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: product-service
        SERVICE_PORT: 8084
    image: minipay/product-service:latest
    container_name: minipay-product-service
    env_file: .env.deploy
    environment:
      SERVER_PORT: 8084
    volumes:
      - product_uploads:/app/uploads
    depends_on:
      - gateway
      - redis
    restart: unless-stopped

  cart-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: cart-service
        SERVICE_PORT: 8085
    image: minipay/cart-service:latest
    container_name: minipay-cart-service
    env_file: .env.deploy
    environment:
      SERVER_PORT: 8085
    depends_on:
      - gateway
      - redis
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: inventory-service
        SERVICE_PORT: 8086
    image: minipay/inventory-service:latest
    container_name: minipay-inventory-service
    env_file: .env.deploy
    environment:
      SERVER_PORT: 8086
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
    depends_on:
      - redis
      - rocketmq-broker
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: order-service
        SERVICE_PORT: 8081
    image: minipay/order-service:latest
    container_name: minipay-order-service
    env_file: .env.deploy
    environment:
      SERVER_PORT: 8081
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
    depends_on:
      - redis
      - rocketmq-broker
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: payment-service
        SERVICE_PORT: 8082
    image: minipay/payment-service:latest
    container_name: minipay-payment-service
    env_file: .env.deploy
    environment:
      SERVER_PORT: 8082
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
    depends_on:
      - redis
      - rocketmq-broker
    restart: unless-stopped

  promotion-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: promotion-service
        SERVICE_PORT: 8087
    image: minipay/promotion-service:latest
    container_name: minipay-promotion-service
    env_file: .env.deploy
    environment:
      SERVER_PORT: 8087
    depends_on:
      - redis
    restart: unless-stopped

  logistics-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: logistics-service
        SERVICE_PORT: 8088
    image: minipay/logistics-service:latest
    container_name: minipay-logistics-service
    env_file: .env.deploy
    environment:
      SERVER_PORT: 8088
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
    depends_on:
      - redis
      - rocketmq-broker
    restart: unless-stopped

  merchant-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: merchant-service
        SERVICE_PORT: 8089
    image: minipay/merchant-service:latest
    container_name: minipay-merchant-service
    env_file: .env.deploy
    environment:
      SERVER_PORT: 8089
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: minipay/frontend:latest
    container_name: minipay-frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  redis_data:
  product_uploads:
