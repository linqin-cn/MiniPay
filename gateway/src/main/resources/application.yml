server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/users/**
        - id: product-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/products/**
        - id: cart-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/cart/**
        - id: inventory-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/inventory/**
        - id: order-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/orders/**, /api/login/**
        - id: payment-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/payments/**
        - id: promotion-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/promotions/**
        - id: logistics-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/logistics/**
        - id: merchant-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/merchants/**
